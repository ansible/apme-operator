# Local hooks: prek install  (https://github.com/j178/prek) or pre-commit install
# CI: .github/workflows/prek.yml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^api/
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^config/crd/bases/
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: golang
        types: [go]
        pass_filenames: false
        require_serial: true
        additional_dependencies:
          - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.0

      - id: golangci-lint-config
        name: golangci-lint config verify
        entry: golangci-lint config verify
        language: golang
        pass_filenames: false
        always_run: true
        additional_dependencies:
          - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.0
